name: Release

# Publishing a release is a maintainer action: push a tag "vX.Y.Z" matching <Version> in Directory.Build.props,
# with a "## [X.Y.Z]" section in CHANGELOG.md. This builds the portable Windows zip with the same script
# maintainers use, runs the tests, and creates the GitHub release that Gmail Watcher's in-app updates read.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (dotnet msbuild src/GmailWatcher.Desktop/GmailWatcher.Desktop.csproj -getProperty:Version).Trim()
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match Version $version in Directory.Build.props." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: pwsh scripts/release-notes.ps1 -Version $env:VERSION > release-notes.md

      - name: Build, test and package
        shell: pwsh
        run: pwsh scripts/publish-windows.ps1

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG `
            "artifacts/release/GmailWatcher-$env:VERSION-win-x64.zip" `
            "artifacts/release/GmailWatcher-$env:VERSION-win-x64.zip.sha256" `
            --title "Gmail Watcher $env:VERSION" --notes-file release-notes.md --verify-tag
